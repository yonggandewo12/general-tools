name: Publish npm package

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version change
    # Manual dispatches also require the current ref to be main; otherwise
    # an unmerged branch could publish unreviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: check
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch: publishing v$NEW_VERSION"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show HEAD~1:package.json 2>/dev/null \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" \
            || echo "0.0.0")
          echo "old=$OLD_VERSION new=$NEW_VERSION"
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (${{ matrix.os }}, system Python)
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci --allow-remote=all

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/ppt-master/requirements.txt
          python -m pip install -r scripts/excel/requirements.txt

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke Python imports
        run: python -c "import pptx, openpyxl, PIL; print('python deps OK')"

  build-platforms:
    name: Build runtime (${{ matrix.platform }})
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64,        os: macos-14 }
          - { platform: darwin-x64,          os: macos-13 }
          - { platform: linux-x64-gnu,       os: ubuntu-22.04 }
          - { platform: linux-arm64-gnu,     os: ubuntu-22.04-arm }
          - { platform: win32-x64-msvc,      os: windows-2022 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        # The build script copies the JS deps out of node_modules into
        # npm-dist/<platform>/scripts/ for Python's PYTHONPATH.
        run: npm ci --allow-remote=all

      - name: Build platform runtime
        # ~2-3 min: download PBS tarball + extract + pip install 13 packages
        # into the embedded site-packages + smoke import.
        run: |
          python3 scripts/build-platform-package.py \
            --platform "${{ matrix.platform }}" \
            --out "npm-dist/${{ matrix.platform }}" \
            --version "${{ needs.check-version.outputs.version }}"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: npm-dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  publish-platforms:
    name: Publish runtime (${{ matrix.platform }})
    needs: [check-version, build-platforms]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - darwin-arm64
          - darwin-x64
          - linux-x64-gnu
          - linux-arm64-gnu
          - win32-x64-msvc
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: npm-dist/${{ matrix.platform }}

      - name: Publish runtime sub-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          PKG="@general-tools/python-runtime-${{ matrix.platform }}"

          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PKG}@${VERSION} already published — skipping"
            exit 0
          fi

          cd "npm-dist/${{ matrix.platform }}"
          echo "=== Publishing ${PKG}@${VERSION} ==="
          ls -la
          cat package.json
          npm publish --access public

  publish-main:
    name: Publish main package
    needs: [check-version, test, publish-platforms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Node dependencies
        run: npm ci --allow-remote=all

      - name: Build
        run: npm run build

      - name: Stamp optionalDependencies to this version
        # Pin each @general-tools/python-runtime-* sub-package to the
        # exact version we're about to publish. Without this, npm would
        # resolve "1.0.0" to the latest matching range and could pick
        # a stale runtime build.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const dep of Object.keys(pkg.optionalDependencies ?? {})) {
              pkg.optionalDependencies[dep] = pkg.version;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          echo "Stamped optionalDependencies to v$VERSION"

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "general-tools-mcp-server@${VERSION}" version >/dev/null 2>&1; then
            echo "general-tools-mcp-server@${VERSION} already published — skipping"
            exit 0
          fi
          npm publish --access public